version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /mcp-server
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /npm
    schedule:
      interval: weekly
    ignore:
      - dependency-name: pline-mcp-darwin-arm64
      - dependency-name: pline-mcp-darwin-x64
      - dependency-name: pline-mcp-linux-arm64
      - dependency-name: pline-mcp-linux-x64
      - dependency-name: pline-mcp-win32-x64
