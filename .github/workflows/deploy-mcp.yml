name: Deploy Pline MCP to production

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published Pline MCP release tag (for example v0.2.0)
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: prod-pline-mcp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Validate release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected a vX.Y.Z release tag"; exit 1; }

      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
          role-to-assume: ${{ secrets.AWS_GREPSR_OIDC_ROLE_ARN }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push production image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          VERSION: ${{ inputs.version }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file mcp-server/Dockerfile \
            --tag "${ECR_REGISTRY}/pline-mcp:${VERSION}" \
            --push mcp-server
