name: Check n8n node

on:
  push:
    branches: ['**']
    paths: ['n8n-pline/**', '.github/workflows/n8n-node-ci.yml']
  pull_request:
    paths: ['n8n-pline/**', '.github/workflows/n8n-node-ci.yml']

permissions:
  contents: read

concurrency:
  group: n8n-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: n8n-pline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: n8n-pline/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Check the package has no runtime dependencies
        run: node -e "const p=require('./package.json'); if (p.dependencies && Object.keys(p.dependencies).length) { console.error('runtime dependencies found'); process.exit(1) }"
      - run: npm pack --dry-run
