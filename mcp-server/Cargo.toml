[package]
name = "pline-mcp"
version = "0.3.3"
edition = "2021"
repository = "https://github.com/grepsr/pline-api"
license = "MIT"
description = "MCP server exposing the pline.ai scrape, crawl, batch, map, and search API."

# Standalone MCP crate; the Python skill does not require Cargo.
[workspace]

[[bin]]
name = "pline-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
futures-util = "0.3"
http = "1"
reqwest = { version = "0.13", features = ["json", "rustls", "stream"], default-features = false }
rmcp = { version = "3.3", features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = "1"
